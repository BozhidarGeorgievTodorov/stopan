name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-package:
    name: Python package checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            pyproject.toml
            setup.py

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Generate protobuf stubs
        run: |
          python -m grpc_tools.protoc \
            -Isrc \
            --python_out=src \
            --grpc_python_out=src \
            src/stopan/protos/p2p_storage.proto \
            src/stopan/protos/membership.proto

      - name: Install Stopan package
        run: |
          python -m pip install -e .
          python -m pip check

      - name: Compile Python modules
        run: |
          python -m compileall -q src/stopan

      - name: Import all Stopan modules
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import stopan

          failures = []

          for module in pkgutil.walk_packages(stopan.__path__, stopan.__name__ + "."):
              name = module.name
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append((name, repr(exc)))

          if failures:
              for name, exc in failures:
                  print(f"{name}: {exc}")
              raise SystemExit(1)

          print("All Stopan modules imported successfully.")
          PY

      - name: Check CLI help
        run: |
          python -m stopan --help
          python -m stopan backup --help
          python -m stopan push --help
          python -m stopan restore --help
          python -m stopan verify --help
          python -m stopan node --help
          python -m stopan init --help
          python -m stopan config --help
          python -m stopan metadata --help
          python -m stopan gc --help

      - name: Validate example configuration files
        run: |
          python -m stopan config validate packaging/examples/stopan.yaml
          python -m stopan config validate configs/node1.yaml
          python -m stopan config validate configs/node2.yaml
          python -m stopan config validate configs/node3.yaml
          python -m stopan config validate configs/node4.yaml

      - name: Validate job profile files
        run: |
          python - <<'PY'
          from pathlib import Path

          from stopan.jobs.runner import _load_profile, _profile_to_env

          profiles_dir = Path("packaging/examples/jobs")
          scripts_dir = Path("packaging/jobs")

          if not profiles_dir.exists():
              raise SystemExit(f"Missing {profiles_dir}")

          files = sorted(profiles_dir.glob("*.yaml"))
          if not files:
              raise SystemExit(f"No job profile YAML files found in {profiles_dir}")

          for path in files:
              profile = _load_profile(path)
              kind, _env = _profile_to_env(profile, path)

              script_path = scripts_dir / f"{kind}.sh"
              if not script_path.is_file():
                  raise SystemExit(
                      f"{path} declares kind={kind}, but {script_path} does not exist"
                  )

              print(f"Valid job profile: {path} -> {script_path}")

          print("All job profile files are valid.")
          PY

      - name: Check packaging shell scripts
        run: |
          for script in packaging/bin/stopan packaging/jobs/run-job packaging/jobs/*.sh; do
            echo "Checking $script"
            sh -n "$script"
          done

      - name: Validate Debian install manifest references
        run: |
          python - <<'PY'
          from glob import glob
          from pathlib import Path

          manifest = Path("debian/stopan.install")
          if not manifest.is_file():
              raise SystemExit("Missing debian/stopan.install")

          missing = []

          for raw_line in manifest.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue

              source = line.split()[0]
              matches = glob(source)

              if not matches:
                  missing.append(source)
              else:
                  print(f"{source}: {len(matches)} match(es)")

          if missing:
              for source in missing:
                  print(f"Missing source referenced by debian/stopan.install: {source}")
              raise SystemExit(1)

          print("All debian/stopan.install source paths exist.")
          PY

      - name: Build Python package artifact
        run: |
          python -m pip wheel . -w dist --no-deps