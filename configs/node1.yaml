node:
  bind_addr: "[::]:50051"
  advertise_addr: "node1:50051"
  repo_store_dir: "/app/node_store"
  local_shard_dir: "/app/state/_data_chunks"
  db_file: "/app/state/_metadata.db"

cluster:
  token: "oficina-demo"
  seeds:
    - "node1:50051"
    - "node2:50051"
    - "node3:50051"
    - "node4:50051"

protection:
  rf: 3
  strict_rf: false

grpc:
  max_message_bytes: 8388608
  keepalive_time_ms: 120000
  keepalive_timeout_ms: 20000
  keepalive_permit_without_calls: false

storage:
  rpc_workers: 64
  commit_workers: 16
  commit_queue_items: 256
  max_chunk_size: 8388608

metadata:
  distributed_pack_store_dir: "/app/node_store/metadata_packs"
  max_distributed_pack_bytes: 8388608
  max_distributed_packs_per_owner: 32
  max_distributed_pack_bytes_per_owner: 268435456
  max_distributed_pack_store_bytes: 1073741824

gc:
  distributed_pack_max_age_days: 0

replication:
  target_parallelism: 4
  probe_batch_hashes: 2048
  stream_inflight: 64
  probe_timeout_s: 10.0
  stream_timeout_s: 60.0
  commit_every: 100

verify:
  target_parallelism: 4
  probe_batch_hashes: 2048
  probe_timeout_s: 10.0

restore:
  batch_target_parallelism: 4
  prefetch_window: 32
  rpc_timeout_s: 5.0

membership:
  protocol_period_s: 1.0
  ping_timeout_s: 0.25
  rpc_timeout_s: 2.0
  suspect_timeout_s: 6.0
  indirect_ping_fanout: 3
  max_gossip_events: 20
  gossip_ttl_s: 60.0
