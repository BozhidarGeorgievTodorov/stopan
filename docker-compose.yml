services:
  node1:
    build: .
    ports:
      - "50051:50051"
    volumes:
      - node1_data:/app/node_store
      - node1_state:/app/state
    container_name: p2p_node_1
    environment:
      - ADVERTISE_ADDR=node1:50051
      - BIND_ADDR=[::]:50051
      - SEEDS=node1:50051,node2:50051,node3:50051,node4:50051
      - CLUSTER_TOKEN=oficina-demo
      - REPO_STORE_DIR=/app/node_store
      - LOCAL_SHARD_DIR=/app/state/_data_chunks
      - DB_FILE=/app/state/_metadata.db
      - REPLICATION_RPC_TIMEOUT_S=10
      - REPLICATION_COMMIT_EVERY=100
      - STORAGE_RPC_WORKERS=64
      - GRPC_MAX_MESSAGE_BYTES=8388608
      - MAX_CHUNK_SIZE=8388608

  node2:
