node:
  bind_addr: "127.0.0.1:0"
  advertise_addr: "client.example.net:0"
  repo_store_dir: "/var/lib/stopan/client_repo"
  local_shard_dir: "/var/lib/stopan/client_chunks"
  db_file: "/var/lib/stopan/client_metadata.db"

cluster:
  token: "change-me"
  seeds:
    - "node.example.net:50051"

protection:
  remote_copies: 3
  strict_remote_copies: false

metadata:
  passphrase_file: "/etc/stopan/metadata.passphrase"
  identity_file: "/etc/stopan/metadata_identity.json"
  object_store_dir: "/var/lib/stopan/metadata_object_store"
  object_pack_dir: "/var/lib/stopan/metadata_packs"
  distributed_pack_store_dir: "/var/lib/stopan/metadata_distributed_packs"
