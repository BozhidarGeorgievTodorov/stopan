syntax = "proto3";

service P2PStorage {
  rpc StoreChunk(StoreRequest) returns (StoreResponse);
  rpc RetrieveChunk(RetrieveRequest) returns (RetrieveResponse);
  rpc ProbeMissingChunks(MissingChunksRequest) returns (MissingChunksResponse);
  rpc StoreChunkBatch(StoreChunkBatchRequest) returns (StoreChunkBatchResponse);
}

message StoreRequest {
  string chunk_hash = 1;
  bytes chunk_data = 2;
}

message StoreResponse {
  bool success = 1;
  string message = 2;
}

message RetrieveRequest {
  string chunk_hash = 1;
}

message RetrieveResponse {
  bool success = 1;
  bytes chunk_data = 2;
  string message = 3;
}

message MissingChunksRequest {
  repeated string chunk_hashes = 1;
}

message MissingChunksResponse {
  repeated string missing_hashes = 1;
}

message BatchStoreItem {
  string chunk_hash = 1;
  bytes chunk_data = 2;
}

message BatchStoreResult {
  string chunk_hash = 1;
  bool success = 2;
  bool already_present = 3;
  string message = 4;
}

message StoreChunkBatchRequest {
  repeated BatchStoreItem items = 1;
}

message StoreChunkBatchResponse {
  repeated BatchStoreResult results = 1;
}
