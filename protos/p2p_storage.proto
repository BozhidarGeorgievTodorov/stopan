syntax = "proto3";

service P2PStorage {
  rpc RetrieveChunkBatch(RetrieveChunkBatchRequest) returns (RetrieveChunkBatchResponse);
  rpc ProbeMissingChunks(MissingChunksRequest) returns (MissingChunksResponse);
  rpc ReplicateChunks(stream StreamStoreItem) returns (stream StreamStoreResult);
}

message BatchRetrieveResult {
  string chunk_hash = 1;
  bool success = 2;
  bytes chunk_data = 3;
  string message = 4;
}

message RetrieveChunkBatchRequest {
  repeated string chunk_hashes = 1;
}

message RetrieveChunkBatchResponse {
  repeated BatchRetrieveResult results = 1;
}

message MissingChunksRequest {
  repeated string chunk_hashes = 1;
}

message MissingChunksResponse {
  repeated string missing_hashes = 1;
}

message StreamStoreItem {
  string chunk_hash = 1;
  bytes chunk_data = 2;
}

message StreamStoreResult {
  string chunk_hash = 1;
  bool success = 2;
  bool already_present = 3;
  string message = 4;
}
