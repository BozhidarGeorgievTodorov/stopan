syntax = "proto3";

package membership;

service Membership {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc PingReq(PingReqRequest) returns (PingReqResponse);
  rpc GetMembers(GetMembersRequest) returns (GetMembersResponse);
}

enum MemberState {
  UNKNOWN = 0;
  ALIVE = 1;
  SUSPECT = 2;
  DEAD = 3;
  LEFT = 4;
}

message NodeInfo {
  string node_id = 1;
  string address = 2;
  uint64 incarnation = 3;
}

message MemberEvent {
  string node_id = 1;
  string address = 2;
  uint64 incarnation = 3;
  MemberState state = 4;
  int64 ts_ms = 5;
}

message JoinRequest {
  NodeInfo self = 1;
  string cluster_token = 2;
}

message JoinResponse {
  repeated NodeInfo members = 1;
  repeated MemberEvent gossip = 2;
}

message PingRequest {
  NodeInfo from_node = 1;
  uint64 seq = 2;
  repeated MemberEvent gossip = 3;
}

message PingResponse {
  bool ok = 1;
  repeated MemberEvent gossip = 2;
}

message PingReqRequest {
  NodeInfo requester = 1;
  NodeInfo target = 2;
  uint64 seq = 3;
  repeated MemberEvent gossip = 4;
}

message PingReqResponse {
  bool ok = 1;
  repeated MemberEvent gossip = 2;
}

message GetMembersRequest {}

message GetMembersResponse {
  repeated NodeInfo members = 1;
}
