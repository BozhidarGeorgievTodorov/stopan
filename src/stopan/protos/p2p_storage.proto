syntax = "proto3";

service P2PStorage {
  rpc ProbeMissingChunks(ProbeMissingChunksRequest) returns (ProbeMissingChunksResponse);
  rpc ReplicateChunks(stream ReplicateChunkRequest) returns (stream ReplicateChunkResult);
  rpc RetrieveChunkBatch(RetrieveChunkBatchRequest) returns (RetrieveChunkBatchResponse);

  rpc ProbeMissingDataPackShards(ProbeMissingDataPackShardsRequest)
      returns (ProbeMissingDataPackShardsResponse);
  rpc ReplicateDataPackShards(stream ReplicateDataPackShardRequest)
      returns (stream ReplicateDataPackShardResult);
  rpc RetrieveDataPackShardBatch(RetrieveDataPackShardBatchRequest)
      returns (RetrieveDataPackShardBatchResponse);
}

service MetadataPackService {
  rpc StoreMetadataPack(StoreMetadataPackRequest) returns (StoreMetadataPackResponse);
  rpc ListMetadataPacks(ListMetadataPacksRequest) returns (ListMetadataPacksResponse);
  rpc RetrieveMetadataPack(RetrieveMetadataPackRequest) returns (RetrieveMetadataPackResponse);
}

message ProbeMissingChunksRequest {
  repeated string chunk_hashes = 1;
}

message ProbeMissingChunksResponse {
  repeated string missing_hashes = 1;
}

enum StoreStatus {
  STORE_STATUS_UNSPECIFIED = 0;
  STORE_STATUS_STORED = 1;
  STORE_STATUS_ALREADY_PRESENT = 2;
  STORE_STATUS_REJECTED_CORRUPT = 3;
  STORE_STATUS_REJECTED_HASH_MISMATCH = 4;
  STORE_STATUS_ERROR = 5;
}

message ReplicateChunkRequest {
  string chunk_hash = 1;
  bytes chunk_data = 2;
}

message ReplicateChunkResult {
  string chunk_hash = 1;
  StoreStatus status = 2;
  string detail = 3;
}

enum RetrieveStatus {
  RETRIEVE_STATUS_UNSPECIFIED = 0;
  RETRIEVE_STATUS_FOUND = 1;
  RETRIEVE_STATUS_NOT_FOUND = 2;
  RETRIEVE_STATUS_ERROR = 3;
}

message RetrieveChunkBatchRequest {
  repeated string chunk_hashes = 1;
}

message RetrievedChunk {
  string chunk_hash = 1;
  RetrieveStatus status = 2;
  bytes chunk_data = 3;
  string detail = 4;
}

message RetrieveChunkBatchResponse {
  repeated RetrievedChunk results = 1;
}

message DataPackShardRef {
  string pack_hash = 1;
  uint32 shard_index = 2;
  string shard_hash = 3;
}

message ProbeMissingDataPackShardsRequest {
  repeated DataPackShardRef shards = 1;
}

message ProbeMissingDataPackShardsResponse {
  repeated DataPackShardRef missing_shards = 1;
}

enum DataPackShardStoreStatus {
  DATA_PACK_SHARD_STORE_STATUS_UNSPECIFIED = 0;
  DATA_PACK_SHARD_STORE_STATUS_STORED = 1;
  DATA_PACK_SHARD_STORE_STATUS_ALREADY_PRESENT = 2;
  DATA_PACK_SHARD_STORE_STATUS_REJECTED_HASH_MISMATCH = 3;
  DATA_PACK_SHARD_STORE_STATUS_REJECTED_INVALID_ARGUMENT = 4;
  DATA_PACK_SHARD_STORE_STATUS_REJECTED_TOO_LARGE = 5;
  DATA_PACK_SHARD_STORE_STATUS_ERROR = 6;
}

message ReplicateDataPackShardRequest {
  string pack_hash = 1;
  uint32 shard_index = 2;
  string shard_hash = 3;
  bytes shard_data = 4;
}

message ReplicateDataPackShardResult {
  string pack_hash = 1;
  uint32 shard_index = 2;
  string shard_hash = 3;
  DataPackShardStoreStatus status = 4;
  string detail = 5;
}

enum DataPackShardRetrieveStatus {
  DATA_PACK_SHARD_RETRIEVE_STATUS_UNSPECIFIED = 0;
  DATA_PACK_SHARD_RETRIEVE_STATUS_FOUND = 1;
  DATA_PACK_SHARD_RETRIEVE_STATUS_NOT_FOUND = 2;
  DATA_PACK_SHARD_RETRIEVE_STATUS_HASH_MISMATCH = 3;
  DATA_PACK_SHARD_RETRIEVE_STATUS_ERROR = 4;
}

message RetrieveDataPackShardBatchRequest {
  repeated DataPackShardRef shards = 1;
}

message RetrievedDataPackShard {
  string pack_hash = 1;
  uint32 shard_index = 2;
  string shard_hash = 3;
  DataPackShardRetrieveStatus status = 4;
  bytes shard_data = 5;
  string detail = 6;
}

message RetrieveDataPackShardBatchResponse {
  repeated RetrievedDataPackShard results = 1;
}

enum MetadataPackStoreStatus {
  METADATA_PACK_STORE_STATUS_UNSPECIFIED = 0;
  METADATA_PACK_STORE_STATUS_STORED = 1;
  METADATA_PACK_STORE_STATUS_ALREADY_PRESENT = 2;
  METADATA_PACK_STORE_STATUS_REJECTED_HASH_MISMATCH = 3;
  METADATA_PACK_STORE_STATUS_REJECTED_TOO_LARGE = 4;
  METADATA_PACK_STORE_STATUS_ERROR = 5;
  METADATA_PACK_STORE_STATUS_REJECTED_SIGNATURE = 6;
  METADATA_PACK_STORE_STATUS_REJECTED_QUOTA = 7;
  METADATA_PACK_STORE_STATUS_REJECTED_INVALID_ARGUMENT = 8;
}

enum MetadataPackRetrieveStatus {
  METADATA_PACK_RETRIEVE_STATUS_UNSPECIFIED = 0;
  METADATA_PACK_RETRIEVE_STATUS_FOUND = 1;
  METADATA_PACK_RETRIEVE_STATUS_NOT_FOUND = 2;
  METADATA_PACK_RETRIEVE_STATUS_ERROR = 3;
}

message StoreMetadataPackRequest {
  string cluster_token = 1;
  string owner_id = 2;
  string pack_hash = 3;
  bytes pack_data = 4;
  string public_key_b64 = 5;
  string signature_b64 = 6;
}

message StoreMetadataPackResponse {
  MetadataPackStoreStatus status = 1;
  string detail = 2;
  string owner_id = 3;
  string pack_hash = 4;
  int64 size_bytes = 5;
  double stored_at_unix = 6;
  string public_key_b64 = 7;
  string signature_b64 = 8;
}

message ListMetadataPacksRequest {
  string cluster_token = 1;
  string owner_id = 2;
}

message MetadataPackRecord {
  string owner_id = 1;
  string pack_hash = 2;
  int64 size_bytes = 3;
  double stored_at_unix = 4;
  string public_key_b64 = 5;
  string signature_b64 = 6;
}

message ListMetadataPacksResponse {
  repeated MetadataPackRecord packs = 1;
}

message RetrieveMetadataPackRequest {
  string cluster_token = 1;
  string owner_id = 2;
  string pack_hash = 3;
}

message RetrieveMetadataPackResponse {
  MetadataPackRetrieveStatus status = 1;
  string detail = 2;
  string owner_id = 3;
  string pack_hash = 4;
  bytes pack_data = 5;
  int64 size_bytes = 6;
  double stored_at_unix = 7;
  string public_key_b64 = 8;
  string signature_b64 = 9;
}
